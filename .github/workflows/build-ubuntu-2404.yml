name: Build (Ubuntu 24.04)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for Ubuntu 24.04 (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [release]
        # Add 'debug' to the list above for a debug build as well
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
    steps:
    - name: Clone tree
      uses: actions/checkout@v4
    - name: Initialize compiler cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-ubuntu2404-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: ccache-ubuntu2404-${{ matrix.configuration }}-
    - name: Install dependencies
      run: |
        sudo apt-get -qy update
        # Pull everything listed in debian/control Build-Depends
        sudo apt-get -qy build-dep .
        # libudev-dev enables evdev light gun support (not yet in debian/control)
        sudo apt-get -qy install ccache libudev-dev flex bison
    - name: Build static libpcap
      # Link libpcap statically so the binary runs on distros whose
      # libpcap soname differs from Debian's libpcap.so.0.8 (e.g.
      # Batocera ships libpcap.so.1). Built without dbus/libnl/usb so
      # the static lib pulls in no extra dependencies. Installed to
      # /usr/local, which pkg-config searches before the system dirs.
      run: |
        curl -sL https://www.tcpdump.org/release/libpcap-1.10.5.tar.gz | tar xz -C /tmp
        cd /tmp/libpcap-1.10.5
        ./configure --prefix=/usr/local --disable-shared --enable-static \
          --disable-dbus --disable-bluetooth --disable-rdma --disable-usb \
          --without-libnl
        make -j$(nproc)
        sudo make install
    - name: Compile
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        ccache -z
        ./build.sh ${{ matrix.configuration == 'debug' && '--debug' || '' }}
        ccache -s
    - name: Verify evdev light gun support is built in
      run: |
        nm build/qemu-system-i386 | grep -q xemu_input_evdev_gun_poll
        echo "evdev light gun support: OK"
    - name: Verify libpcap is linked statically
      run: |
        if ldd build/qemu-system-i386 | grep libpcap; then
          echo "ERROR: binary still depends on shared libpcap" >&2
          exit 1
        fi
        echo "no shared libpcap dependency: OK"
        ldd build/qemu-system-i386
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: xemu-ubuntu-24.04-${{ matrix.configuration }}
        path: dist
        if-no-files-found: error
