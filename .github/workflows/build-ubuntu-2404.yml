name: Build on Ubuntu 24.04

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
    steps:
      - name: Clone tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install \
            ccache \
            cmake \
            git \
            ninja-build \
            python3 \
            python3-pip \
            python3-tomli \
            python3-yaml \
            python3-venv \
            libepoxy-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libsamplerate0-dev \
            zlib1g-dev \
            libssl-dev \
            libpcap-dev \
            libslirp-dev \
            libvulkan-dev \
            libusb-1.0-0-dev \
            libcurl4-gnutls-dev \
            libpipewire-0.3-dev

      - name: Initialize compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-24.04-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-24.04-${{ matrix.configuration }}-

      - name: Setup ccache
        run: |
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR"
          ccache -z

      - name: Build
        run: |
          if [[ "${{ matrix.configuration }}" == "debug" ]]; then
            ./build.sh --debug
          else
            ./build.sh
          fi

      - name: Report ccache stats
        run: ccache -s

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xemu-ubuntu-24.04-${{ matrix.configuration }}
          path: dist
          if-no-files-found: error
